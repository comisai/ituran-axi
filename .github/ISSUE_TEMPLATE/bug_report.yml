name: Bug report
description: Something ituran-axi does wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not paste passwords, tokens, plates, driver names, positions or addresses; replace them with placeholders.
        For a security problem, use the private report described in SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `ituran-axi --version`, or the commit.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node.js version and operating system, and whether it ran inside Comis.
      placeholder: Node 22.18, macOS 15, outside Comis
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The command you ran and what it printed, with personal data replaced.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
